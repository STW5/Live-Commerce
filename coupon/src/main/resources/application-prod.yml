server:
  port: 19100

eureka:
  client:
    service-url:
      defaultZone: http://eureka:19090/eureka/

spring:
  application:
    name: coupon
  config:
    import: optional:file:.env[.properties]
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        default_schema: coupons
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: >
          order-failed:com.live_commerce.coupon.infrastructure.kafka.event.OrderFailedEvent,
          coupon-used:com.live_commerce.coupon.infrastructure.kafka.event.CouponUsedEvent,
          first-join-coupon:com.live_commerce.coupon.infrastructure.kafka.event.FirstJoinCouponEvent

management:
  endpoints:
    web:
      exposure:
        include: refresh
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

gateway:
  base-url: http://gateway:19091

springdoc:
  api-docs:
    path: /v3/api-docs/coupon