spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
      fail-fast: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379

gateway:
  base-url: localhost:19091

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
